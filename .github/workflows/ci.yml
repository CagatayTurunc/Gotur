name: CI Pipeline

# Bu pipeline her PR ve main/develop push'unda çalışır.
# Adım sırası: build → docker → smoke test → k8s manifest check → (main'de) image push
# Her adım neden var: koda güven katmanları. Her katman farklı bir şeyi doğrular.

permissions:
  contents: read
  packages: write   # GHCR'a image push için gerekli

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Backend Build ──────────────────────────────────────────────────────
  # Neden: Derleme hatası varsa sonraki adımlara geçme.
  # Docker build'den önce yapılır çünkü çok daha hızlıdır — erken geri bildirim.
  backend:
    name: Backend (.NET 9)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore GetirReplica.sln
        working-directory: backend

      - name: Build
        run: dotnet build GetirReplica.sln --no-restore --configuration Release
        working-directory: backend

  # ── 2. Unit Tests ─────────────────────────────────────────────────────────
  # Neden: 35 xUnit testi — durum makinesi, Haversine, fiyat validasyonu, Redis rate limit.
  # Build'den ayrı job: pipeline'da ayrı yeşil/kırmızı kutucuk olarak görünür.
  # --no-build: backend job zaten derledi, tekrar derleme gerekmez.
  unit-tests:
    name: Unit Tests (.NET 9)
    runs-on: ubuntu-latest
    needs: [backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore GetirReplica.sln
        working-directory: backend

      - name: Build
        run: dotnet build GetirReplica.sln --no-restore --configuration Release
        working-directory: backend

      - name: Run unit tests
        run: |
          dotnet test GetirReplica.sln \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults
        working-directory: backend

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: backend/TestResults/test-results.trx
          retention-days: 14

  # ── 2. Frontend Build & Type Check ───────────────────────────────────────
  # Neden: TypeScript tip hatalarını derleme hataları gibi yakala.
  # npm ci; package-lock.json'u baz alır — herkes aynı versiyonu çeker.
  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/GetirReplica.API/gotur-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend/GetirReplica.API/gotur-web

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: backend/GetirReplica.API/gotur-web

      - name: Build
        run: npm run build
        working-directory: backend/GetirReplica.API/gotur-web

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: backend/GetirReplica.API/gotur-web/dist
          retention-days: 7

  # ── 3. Docker Image Build ─────────────────────────────────────────────────
  # Neden: Dockerfile'ın derlenebilir olduğunu doğrula.
  # Sadece main push'unda push eder — PR'larda yalnızca build kontrolü yapılır.
  # Image tag: git SHA → immutable, her commit farklı image, rollback kolay.
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [unit-tests, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR registry adı lowercase olmak zorunda.
      # github.repository_owner büyük harf içerebilir (CagatayTurunc gibi).
      # Bu adım lowercase versiyonu env var olarak set eder.
      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/GetirReplica.API
          file: ./backend/GetirReplica.API/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/gotur-api:latest
            ghcr.io/${{ env.OWNER }}/gotur-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/GetirReplica.API/gotur-web
          file: ./backend/GetirReplica.API/gotur-web/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/gotur-frontend:latest
            ghcr.io/${{ env.OWNER }}/gotur-frontend:${{ github.sha }}
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          no-cache: true

  # ── 4. k6 Smoke Test (gerçek API + DB + Redis) ───────────────────────────
  # Neden: "Derlendi" demek "çalışıyor" demek değildir.
  # Gerçek PostgreSQL ve Redis ile ayağa kaldırıp login akışını test et.
  # docker compose up api → /health/ready probe'u geçene kadar bekle → k6 smoke.
  # health check condition: api servisinin kendi healthcheck'ini bekler (60sn timeout).
  load-smoke:
    name: k6 Login Smoke Test
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --build: her CI'da fresh image.
      # OTEL_SDK_DISABLED=true: CI'da Jaeger yok, OTLP bağlantı retry'ları
      # startup'ı geciktiriyor. Sadece bu job için OpenTelemetry'yi kapat.
      # RATE_LIMIT_AUTH_PERMITS=200: k6 smoke testi 20 istek gönderiyor; prod limiti
      # olan 10/dk CI ortamında test isteklerini bloklar. CI'da yüksek limit kullan.
      - name: Start API stack
        run: |
          docker compose up -d --build postgres redis api
        env:
          OTEL_SDK_DISABLED: "true"
          RATE_LIMIT_AUTH_PERMITS: "200"

      # Doğrudan /health/ready endpoint'ini sorgula.
      # Container health status bazen gecikebilir; HTTP 200 daha güvenilir.
      - name: Wait for API to be healthy
        shell: bash
        run: |
          echo "API /health/ready bekleniyor..."
          for attempt in {1..90}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5131/health/ready 2>/dev/null || echo "000")
            echo "  Deneme $attempt/90 — HTTP: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "API hazır."
              exit 0
            fi
            sleep 5
          done
          echo "API zamanında hazır olmadı. Loglar:"
          docker compose logs api postgres redis
          exit 1

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq && sudo apt-get install -y k6

      - name: Run k6 smoke profile
        run: |
          sleep 15
          mkdir -p tests/load/results
          # Login endpoint'ini manuel test et — k6 öncesi doğrulama
          echo "=== Login endpoint manuel test ==="
          curl -s -w "\nHTTP_CODE:%{http_code}" \
            -X POST http://127.0.0.1:5131/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"ahmet.yilmaz@gotur.com","password":"Test123!"}' | tail -5
          echo ""
          echo "=== k6 smoke testi başlıyor ==="
          # k6 direkt runner'da çalışıyor (Docker container değil)
          # --network host sorununu ortadan kaldırır
          cd tests/load
          BASE_URL=http://127.0.0.1:5131 PROFILE=smoke \
            SUMMARY_PATH=results/login-summary.json \
            k6 run login.js

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-login-summary
          path: tests/load/results/login-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop test environment
        if: always()
        run: docker compose down -v

  # ── 5. Kubernetes Manifest Doğrulaması ───────────────────────────────────
  # Neden: kubectl kustomize tüm YAML'ları birleştirip render eder.
  # Syntax hatası veya eksik referans varsa bu adım patlar.
  # Gerçek cluster gerekmez; sadece kubectl binary yeterli.
  kubernetes:
    name: Kubernetes Manifest Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # kubectl kustomize: kustomization.yaml'daki tüm dosyaları birleştirip
      # çıktı üretir. Hata yoksa stdout'a YAML döker, pipeline yeşil kalır.
      - name: Render Kustomize manifests
        run: kubectl kustomize infra/k8s

  # ── 6. Otomatik Deploy ────────────────────────────────────────────────────
  # Neden: Docker image push yeşil olduktan sonra sunucuya otomatik deploy.
  # Akış: SSH bağlan → git pull → kubectl rollout restart (yeni image çeker)
  # Sadece main branch push'unda çalışır — PR'larda deploy yapılmaz.
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: SSH → git pull → kubectl rollout restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            cd ~/gotur
            git pull origin main
            kubectl rollout restart deployment/gotur-api -n gotur
            kubectl rollout restart deployment/gotur-frontend -n gotur
            kubectl rollout status deployment/gotur-api -n gotur --timeout=300s
            kubectl rollout status deployment/gotur-frontend -n gotur --timeout=300s
