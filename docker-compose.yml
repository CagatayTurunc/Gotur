services:
  # PostgreSQL — postgis/postgis image PostGIS destekler
  # Not: postgis/postgis:16-3.4 image'ı Docker Hub'dan çekilmezse
  # mevcut postgres:16-alpine kullanıp PostGIS'i manuel kur
  postgres:
    image: postgis/postgis:16-3.4
    container_name: gotur-postgres
    environment:
      POSTGRES_DB: getir_replica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - gotur_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: gotur-redis
    ports:
      - "${GOTUR_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend/GetirReplica.API
      dockerfile: Dockerfile
    container_name: gotur-api
    ports:
      - "${GOTUR_API_PORT:-5131}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=getir_replica;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Secret=gotur-super-secret-key-32-chars-min!
      - Jwt__Issuer=GetirReplicaAPI
      - Jwt__Audience=GetirReplicaClient
      - Jwt__ExpiryMinutes=480
      # CI'da Jaeger yoktur; OTLP bağlantı denemeleri startup'ı yavaşlatır.
      # Bu değişken ortam tarafından override edilebilir (CI: true, prod: false).
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-false}
      # Auth rate limit: prod'da 10/dk (brute-force koruması).
      # CI smoke testinde k6 daha fazla istek gönderir; RATE_LIMIT_AUTH_PERMITS ile override et.
      - RATE_LIMIT_AUTH_PERMITS=${RATE_LIMIT_AUTH_PERMITS:-10}
      - Frontend__BaseUrl=https://gotur.site
      - Smtp__Host=smtp.gmail.com
      - Smtp__Port=587
      - Smtp__Username=cagatayturuncc06@gmail.com
      - Smtp__Password=vaee nnof grmf guwg
      - Smtp__FromName=Götür
      - Smtp__FromAddress=cagatayturuncc06@gmail.com
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # /health/ready; PostgreSQL + Redis bağlantısını doğrular.
    # start_period: seed data + migration süresi için yeterli süre ver.
    # retries × interval = toplam bekleme: 20 × 15s = 300s (5 dakika)
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 20

  frontend:
    build:
      context: ./backend/GetirReplica.API/gotur-web
      dockerfile: Dockerfile
    container_name: gotur-frontend
    ports:
      - "3000:80"
    depends_on:
      - api

  # ── Jaeger — Distributed Tracing UI (sadece local dev) ───────────────────
  # OpenTelemetry OTLP → Jaeger → trace waterfall görünümü
  # http://localhost:16686 adresinden erişilir
  # Sunucuya deploy edilmez — docker-compose.monitoring.yml'e taşınabilir
  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: gotur-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC (API buraya push eder)
    profiles:
      - tracing  # sadece: docker compose --profile tracing up

volumes:
  gotur_pgdata:
