apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gotur
  namespace: gotur
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    # cert-manager bu annotation'ı görünce otomatik sertifika alır.
    # Let's Encrypt HTTP-01 challenge: port 80'den doğrulama yapıp
    # sertifikayı "gotur-tls" secret'ına yazar.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # HTTP → HTTPS otomatik yönlendirme
    traefik.ingress.kubernetes.io/router.middlewares: gotur-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  # TLS sertifikası — cert-manager otomatik yönetir
  tls:
    - hosts:
        - gotur.site
        - www.gotur.site
      secretName: gotur-tls
  rules:
    - host: gotur.site
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gotur-api
                port:
                  name: http
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: gotur-api
                port:
                  name: http
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: gotur-api
                port:
                  name: http
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: gotur-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gotur-frontend
                port:
                  name: http
    - host: www.gotur.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gotur-frontend
                port:
                  name: http
