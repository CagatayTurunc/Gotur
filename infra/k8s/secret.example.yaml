# Bu dosya format referansıdır — gerçek değer içermez, Git'e girmesi güvenlidir.
# Gerçek Secret'ı aşağıdaki kubectl komutuyla oluştur:
#
# kubectl create secret generic gotur-api-secrets \
#   --namespace gotur \
#   --from-literal=POSTGRES_USER='gotur' \
#   --from-literal=POSTGRES_PASSWORD='GUCLU_BIR_SIFRE' \
#   --from-literal=REDIS_PASSWORD='BASKA_BIR_SIFRE' \
#   --from-literal=Jwt__Secret='EN_AZ_32_KARAKTER_RASTGELE'
#
# Production'da External Secrets veya Sealed Secrets kullan.
apiVersion: v1
kind: Secret
metadata:
  name: gotur-api-secrets
  namespace: gotur
type: Opaque
stringData:
  POSTGRES_USER: "gotur"
  POSTGRES_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"
  Jwt__Secret: "CHANGE_ME_TO_AT_LEAST_32_RANDOM_CHARACTERS_HERE"
