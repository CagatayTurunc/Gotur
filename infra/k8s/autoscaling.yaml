apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gotur-api
  namespace: gotur
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gotur-api
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gotur-api
  namespace: gotur
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gotur-api
