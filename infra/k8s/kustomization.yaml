apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# kubectl apply -k infra/k8s → tüm kaynakları tek komutla uygular.
# Sıra önemli: namespace önce, bağımlılıklar sonra.
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml      # PostgreSQL — bağımlılık, API'den önce hazır olmalı
  - redis.yaml         # Redis — bağımlılık, API'den önce hazır olmalı
  - api.yaml           # API — readiness probe postgres+redis'i bekler
  - frontend.yaml      # Frontend — API'ye bağımlı değil, paralel başlayabilir
  - ingress.yaml       # Ingress — servisler hazır olduktan sonra trafik yönlendir
  - autoscaling.yaml   # HPA + PDB — deployment'lardan sonra

# Image tag yönetimi.
# CI'da: kustomize edit set image ... ile SHA otomatik güncellenir.
images:
  - name: ghcr.io/cagatayturunc/gotur-api
    newName: docker.io/library/gotur-api
    newTag: latest
  - name: ghcr.io/cagatayturunc/gotur-frontend
    newName: docker.io/library/gotur-frontend
    newTag: latest
