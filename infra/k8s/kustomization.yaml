apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - api.yaml
  - frontend.yaml
  - middleware.yaml
  - ingress.yaml
  # autoscaling.yaml kapalı — t3.small için HPA RAM'i dolduruyor

# Image'lar GHCR'dan çekilir — public olarak ayarlandı.
# api.yaml ve frontend.yaml'da zaten ghcr.io/cagatayturunc/... yazıyor.
# Bu images bloğu ek override yapmıyor, sadece tag yönetimi için.
images:
  - name: ghcr.io/cagatayturunc/gotur-api
    newTag: latest
  - name: ghcr.io/cagatayturunc/gotur-frontend
    newTag: latest
