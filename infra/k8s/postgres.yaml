apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: gotur
spec:
  # k3s local-path storage class'ı otomatik PV oluşturur.
  # Production'da bu satır kaldırılır, RDS kullanılır.
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: gotur
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: gotur
spec:
  # PostgreSQL stateful — tek replica. Production'da StatefulSet + RDS.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: gotur
    spec:
      containers:
        - name: postgres
          # postgis/postgis: PostGIS extension dahil. ST_DWithin sorguları için gerekli.
          image: postgis/postgis:16-3.4
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: getir_replica
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: gotur-api-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gotur-api-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: gotur
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
  # ClusterIP: sadece cluster içinden erişilebilir, dışarıya açık değil
  type: ClusterIP
