server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip sıkıştırma — JS/CSS dosyaları %70 küçülür, sayfa daha hızlı yüklenir
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # React Router — tüm client-side rotaları index.html'e yönlendir.
    # Olmasa /tracking/123 gibi URL'lere direkt erişimde nginx 404 döner.
    location / {
        try_files $uri $uri/ /index.html;

        # Statik asset'ler için cache — HTML asla cache'lenmesin (her deploy'da yeni gelsin)
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Kubernetes ortamında API ve WebSocket trafiği bu nginx'ten GEÇMEZ.
    # Traefik Ingress, /api ve /hubs path'lerini direkt gotur-api servisine yönlendirir.
    # Bu blok sadece docker-compose (local geliştirme) ortamında devreye girer —
    # compose'da Ingress yoktur, nginx proxy görevini üstlenir.
    location /api {
        proxy_pass http://gotur-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /hubs {
        proxy_pass http://gotur-api:8080;
        proxy_http_version 1.1;
        # WebSocket upgrade için zorunlu header'lar
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        # SignalR bağlantısı uzun süre açık kalır — timeout'u 24 saat yap
        proxy_read_timeout 86400;
    }
}
